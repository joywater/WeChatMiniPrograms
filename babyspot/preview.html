<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宝宝认一认 - 页面预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #F3EDE5;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 12px;
  }
  .phone {
    width: 375px;
    background: #FFF6EC;
    border-radius: 32px;
    box-shadow: 0 20px 60px rgba(120, 90, 60, 0.25);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 780px;
  }
  .navbar {
    background: #FFF6EC;
    text-align: center;
    padding: 14px 0 10px;
    font-size: 16px;
    font-weight: 600;
    color: #4A3B32;
    border-bottom: 1px solid #F5EDE4;
  }
  .screen { flex: 1; overflow-y: auto; padding: 0 14px 24px; }
  .screen.hidden { display: none; }

  /* ---- 首页 ---- */
  .hero { text-align: center; padding: 28px 0 24px; }
  .hero-title { font-size: 27px; font-weight: 700; color: #4A3B32; }
  .hero-sub { margin-top: 8px; font-size: 15px; color: #A08A78; }

  .main-grid { display: flex; flex-wrap: wrap; justify-content: space-between; }
  .main-card {
    position: relative;
    width: 48%;
    height: 150px;
    margin-bottom: 12px;
    border-radius: 18px;
    padding: 17px 16px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 3px 9px rgba(120, 90, 60, 0.08);
    transition: transform 0.15s;
  }
  .main-card:active { transform: scale(0.96); }
  .soon-badge {
    position: absolute; top: 10px; right: 10px;
    padding: 2px 8px; border-radius: 10px;
    background: rgba(255,255,255,0.85);
    font-size: 12px; color: #A08A78;
  }
  .main-name { font-size: 21px; font-weight: 600; color: #4A3B32; }
  .main-emoji {
    position: absolute; right: 7px; bottom: 0;
    font-size: 70px; line-height: 1.25;
  }

  .more-section { margin-top: 14px; }
  .more-title { font-size: 15px; font-weight: 600; color: #4A3B32; }
  .chips { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: flex; align-items: center;
    padding: 8px 12px; border-radius: 20px; cursor: pointer;
    transition: transform 0.15s;
  }
  .chip:active { transform: scale(0.95); }
  .chip-emoji { font-size: 16px; margin-right: 5px; }
  .chip-name { font-size: 14px; font-weight: 600; }
  .chip-count { margin-left: 5px; font-size: 11px; opacity: 0.75; }

  .toast {
    position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%);
    background: rgba(0,0,0,0.75); color: #fff;
    padding: 10px 18px; border-radius: 8px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
    max-width: 320px;
  }
  .toast.show { opacity: 1; }

  /* ---- 图库页 ---- */
  .grid { display: flex; flex-wrap: wrap; justify-content: space-between; padding-top: 14px; }
  .card {
    width: 31%; margin-bottom: 13px;
    background: #fff; border-radius: 13px;
    padding: 7px 7px 10px;
    display: flex; flex-direction: column; align-items: center;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(120, 90, 60, 0.08);
    transition: transform 0.12s;
  }
  .card.pop { transform: scale(1.1); }
  .card-img-wrap {
    width: 100%; height: 90px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 48px; overflow: hidden;
  }
  .card-label { margin-top: 7px; font-size: 15px; font-weight: 600; color: #4A3B32; }

  .back-tip { text-align: center; font-size: 12px; color: #C4B3A4; padding-top: 16px; }
  .navbar .back { float: left; margin-left: 14px; cursor: pointer; color: #4A3B32; }
</style>
</head>
<body>
  <div class="phone">
    <div class="navbar" id="navbar">宝宝认一认</div>

    <!-- 首页 -->
    <div class="screen" id="screen-index">
      <div class="hero">
        <div class="hero-title">0-3岁认知启蒙</div>
        <div class="hero-sub">每天10分钟，开启宝宝的第一堂认知课</div>
      </div>
      <div class="main-grid" id="mainGrid"></div>
    </div>

    <!-- 图库 -->
    <div class="screen hidden" id="screen-gallery">
      <div class="grid" id="galleryGrid"></div>
      <div class="back-tip">← 点击导航栏返回按钮回到首页</div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
  var categories = [
    { id: 'family',   name: '认识人物', emoji: '👩👨', size: 55, color: '#F2708A', light: '#FFE9E7', main: true },
    { id: 'animal',   name: '认识动物', emoji: '🐱', size: 70, color: '#F5A25D', light: '#FDF0DC', main: true },
    { id: 'color',    name: '认识颜色', emoji: '🎨', size: 70, color: '#5BA8E5', light: '#E3F1FD', main: true },
    { id: 'shape',    name: '认识形状', emoji: '🔺', size: 95, color: '#4DBBA4', light: '#E0F5EF', main: true },
    { id: 'language', name: '语言启蒙', emoji: '💬', size: 70, color: '#7BC47F', light: '#E9F5E6', main: true, placeholder: true }
  ];

  var items = {
    animal: [['a1','小狗','🐶','小狗，小狗汪汪叫'],['a2','小猫','🐱','小猫，小猫喵喵叫'],['a3','鸭子','🦆','鸭子，鸭子嘎嘎叫'],['a4','大象','🐘','大象，大象鼻子长'],['a5','老虎','🐯','老虎，老虎是森林之王'],['a6','小兔','🐰','小兔，小兔爱吃萝卜'],['a7','熊猫','🐼','熊猫，熊猫爱吃竹子'],['a8','狮子','🦁','狮子，狮子有大鬃毛']],
    color:  [['c1','红色','🔴','红色，苹果是红色的'],['c2','黄色','🟡','黄色，香蕉是黄色的'],['c3','蓝色','🔵','蓝色，天空是蓝色的'],['c4','绿色','🟢','绿色，小草是绿色的'],['c5','橙色','🟠','橙色，橘子是橙色的'],['c6','紫色','🟣','紫色，葡萄是紫色的'],['c7','黑色','⚫','黑色，夜晚是黑色的'],['c8','白色','⚪','白色，雪花是白色的']],
    shape:  [['s1','圆形','⭕','圆形，皮球是圆形的'],['s2','三角形','🔺','三角形，三明治是三角形的'],['s3','正方形','⬜','正方形，饼干是正方形的'],['s4','菱形','🔶','菱形，风筝是菱形的'],['s5','星形','⭐','星形，星星是星形的'],['s6','心形','💗','心形，爱心是心形的'],['s7','月牙','🌙','月牙，月亮弯弯像月牙'],['s8','十字','➕','十字，医院挂着十字']],
    family: [['f1','爸爸','👨','爸爸，爸爸是男生'],['f2','妈妈','👩','妈妈，妈妈是女生'],['f3','爷爷','👴','爷爷，爸爸的爸爸叫爷爷'],['f4','奶奶','👵','奶奶，爸爸的妈妈叫奶奶'],['f5','外公','🧓','外公，妈妈的爸爸叫外公'],['f6','外婆','👵','外婆，妈妈的妈妈叫外婆']]
  };

  var toastTimer = null;
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }

  // 浏览器 TTS 模拟小程序同声传译效果
  function speak(text) {
    if (!window.speechSynthesis) return;
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 0.85;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }

  // ---- 渲染首页（占位分类排最后） ----
  var mainGrid = document.getElementById('mainGrid');
  var mains = categories.filter(function (c) { return c.main; });
  var sorted = mains.filter(function (c) { return !c.placeholder; })
    .concat(mains.filter(function (c) { return c.placeholder; }));
  sorted.forEach(function (cat) {
    var card = document.createElement('div');
    card.className = 'main-card';
    card.style.background = 'linear-gradient(155deg, ' + cat.light + ' 0%, #FFFFFF 130%)';
    card.innerHTML =
      (cat.placeholder ? '<div class="soon-badge">敬请期待</div>' : '') +
      '<div class="main-name">' + cat.name + '</div>' +
      '<div class="main-emoji" style="font-size:' + cat.size + 'px;">' + cat.emoji + '</div>';
    card.onclick = function () { openCategory(cat); };
    mainGrid.appendChild(card);
  });

  function openCategory(cat) {
    if (cat.placeholder) {
      showToast(cat.name + '内容建设中，敬请期待');
      return;
    }
    var grid = document.getElementById('galleryGrid');
    grid.innerHTML = '';
    (items[cat.id] || []).forEach(function (it) {
      var el = document.createElement('div');
      el.className = 'card';
      el.innerHTML =
        '<div class="card-img-wrap" style="background:' + cat.light + ';">' + it[2] + '</div>' +
        '<div class="card-label">' + it[1] + '</div>';
      el.onclick = function () {
        el.classList.add('pop');
        speak(it[3] || it[1]);
        setTimeout(function () { el.classList.remove('pop'); }, 400);
      };
      grid.appendChild(el);
    });
    document.getElementById('navbar').innerHTML =
      '<span class="back" onclick="goBack()">‹ 返回</span>' + cat.name;
    document.getElementById('screen-index').classList.add('hidden');
    document.getElementById('screen-gallery').classList.remove('hidden');
  }

  function goBack() {
    document.getElementById('screen-gallery').classList.add('hidden');
    document.getElementById('screen-index').classList.remove('hidden');
    document.getElementById('navbar').textContent = '宝宝认一认';
    if (window.speechSynthesis) speechSynthesis.cancel();
  }
</script>
</body>
</html>
