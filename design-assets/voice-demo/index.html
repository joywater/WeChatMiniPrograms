<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宝宝认一认 · 语音试听</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --line: #2c313b;
    --text: #e8eaed; --dim: #9aa0aa; --accent: #f5a25d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 20px 60px; background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .item { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; transition: .15s; }
  .item:hover { border-color: #4a5160; }
  .item.active { border-color: var(--accent); background: #23272f; }
  .label { font-size: 14px; font-weight: 600; }
  .say { color: var(--dim); font-size: 11px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cat { color: #6b7280; font-size: 10px; margin-top: 4px; }
  .tip { margin-top: 30px; padding: 12px 14px; border-left: 2px solid var(--accent); background: #1a1d23; color: var(--dim); font-size: 12px; border-radius: 0 8px 8px 0; }
  code { background: #262a32; padding: 1px 5px; border-radius: 4px; font-size: 12px; color: #d7dbe2; }
</style>
</head>
<body>
<div class="wrap">
  <h1>语音试听</h1>
  <div class="sub">腾讯云 TTS · 音色 101016 智甜（女童声）· 语速 -0.4 · 响度归一 -16 LUFS。点卡片即播放。</div>

  <div class="grid" id="grid"></div>

  <div class="tip">
    重新生成：<code>python scripts/gen_voice.py --force</code>　换音色：<code>--voice 101015</code>（智萌·男童声）<br>
    30 条共 396KB，24kHz/单声道/32kbps，主包约 560KB，远低于 2MB 上限。
  </div>
</div>
<script>
const items = [
  ['family_爸爸.mp3', '爸爸', '爸爸，爸爸是男生', '人物'],
  ['family_妈妈.mp3', '妈妈', '妈妈，妈妈是女生', '人物'],
  ['family_爷爷.mp3', '爷爷', '爷爷，爸爸的爸爸叫爷爷', '人物'],
  ['family_奶奶.mp3', '奶奶', '奶奶，爸爸的妈妈叫奶奶', '人物'],
  ['family_外公.mp3', '外公', '外公，妈妈的爸爸叫外公', '人物'],
  ['family_外婆.mp3', '外婆', '外婆，妈妈的妈妈叫外婆', '人物'],
  ['animal_小狗.mp3', '小狗', '小狗，小狗汪汪叫', '动物'],
  ['animal_小猫.mp3', '小猫', '小猫，小猫喵喵叫', '动物'],
  ['animal_鸭子.mp3', '鸭子', '鸭子，鸭子嘎嘎叫', '动物'],
  ['animal_大象.mp3', '大象', '大象，大象鼻子长', '动物'],
  ['animal_老虎.mp3', '老虎', '老虎，老虎是森林之王', '动物'],
  ['animal_小兔.mp3', '小兔', '小兔，小兔爱吃萝卜，蹦蹦跳跳', '动物'],
  ['animal_熊猫.mp3', '熊猫', '熊猫，熊猫爱吃竹子', '动物'],
  ['animal_狮子.mp3', '狮子', '狮子，狮子有大鬃毛，嗷呜', '动物'],
  ['color_红色.mp3', '红色', '红色，苹果是红色的', '颜色'],
  ['color_黄色.mp3', '黄色', '黄色，香蕉是黄色的', '颜色'],
  ['color_蓝色.mp3', '蓝色', '蓝色，天空是蓝色的', '颜色'],
  ['color_绿色.mp3', '绿色', '绿色，小草是绿色的', '颜色'],
  ['color_橙色.mp3', '橙色', '橙色，橘子是橙色的', '颜色'],
  ['color_紫色.mp3', '紫色', '紫色，葡萄是紫色的', '颜色'],
  ['color_黑色.mp3', '黑色', '黑色，夜晚是黑色的', '颜色'],
  ['color_白色.mp3', '白色', '白色，雪花是白色的', '颜色'],
  ['shape_圆形.mp3', '圆形', '圆形，皮球是圆形的', '形状'],
  ['shape_三角形.mp3', '三角形', '三角形，三明治是三角形的', '形状'],
  ['shape_正方形.mp3', '正方形', '正方形，饼干是正方形的', '形状'],
  ['shape_菱形.mp3', '菱形', '菱形，风筝是菱形的', '形状'],
  ['shape_星形.mp3', '星形', '星形，星星是星形的', '形状'],
  ['shape_心形.mp3', '心形', '心形，爱心是心形的', '形状'],
  ['shape_月牙.mp3', '月牙', '月牙，月亮弯弯像月牙', '形状'],
  ['shape_十字.mp3', '十字', '十字，医院挂着十字', '形状']
];

const audio = new Audio();
let current = null;
function play(src, el) {
  if (current) current.classList.remove('active');
  current = el; el.classList.add('active');
  audio.src = src;
  audio.play().catch(e => console.warn('播放失败', e));
}
audio.onended = () => { if (current) current.classList.remove('active'); current = null; };

const gbox = document.getElementById('grid');
items.forEach(([file, label, say, cat]) => {
  const d = document.createElement('div');
  d.className = 'item';
  d.innerHTML = `<div class="label">${label}</div><div class="say">${say}</div><div class="cat">${cat}</div>`;
  d.onclick = () => play(encodeURI(`../../babyspot/assets/voice/${file}`), d);
  gbox.appendChild(d);
});
</script>
</body>
</html>
